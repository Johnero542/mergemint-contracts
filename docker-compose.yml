version: "3.9"

services:
  backend:
    build:
      context: ./mergemint-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=sqlite:///data/mergemint.db
      - STELLAR_NETWORK=testnet
      - SOROBAN_RPC_URL=https://soroban-testnet.stellar.org
      - RUST_LOG=info
    volumes:
      - sqlite-data:/data

  frontend:
    build:
      context: ./mergemint-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_STELLAR_NETWORK=testnet
    depends_on:
      - backend

volumes:
  sqlite-data:
